name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Tests in the Workers runtime, with a local D1 and the real migration
        run: pnpm test
      - name: Bundle the Worker and the site
        run: pnpm exec wrangler deploy --dry-run --outdir dist

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Available Xcode versions
        run: |
          ls -d /Applications/Xcode*.app
          /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild -version
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: SnuffleKit tests
        working-directory: ios/Packages/SnuffleKit
        run: swift test
      - name: Build the app
        working-directory: ios
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild build -project Snuffle.xcodeproj -scheme Snuffle \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -n -E "error|Error|failed" build.log | sort -u | head -80 || true; tail -40 build.log; exit 1; }
          tail -3 build.log
