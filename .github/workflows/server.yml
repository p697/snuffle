name: Server

on:
  pull_request:
    paths: ["server/**", "site/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", "site/**", ".github/workflows/server.yml"]

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Tests in the Workers runtime, with a local D1 and the real migration
        run: pnpm test
      - name: Bundle the Worker and the site
        run: pnpm exec wrangler deploy --dry-run --outdir dist
